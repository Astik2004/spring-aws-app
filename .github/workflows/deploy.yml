name: Deploy Spring Boot to EC2

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Build JAR
      - name: Build JAR
        run: mvn clean package -DskipTests

      # 4. Ensure EC2 folder exists + clean old jar
      - name: Prepare EC2 directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/app
            rm -f /home/ubuntu/app/app.jar || true

      # 5. Copy JAR to EC2
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/app.jar"
          target: "/home/ubuntu/app/"

      # 6. Deploy & Restart App
      - name: Restart App on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            echo "Stopping old application..."
            pkill -f app.jar || echo "No running process found"

            echo "Starting new application..."
            nohup java -jar /home/ubuntu/app/app.jar > /home/ubuntu/app.log 2>&1 & disown

            echo "Deployment successful 🚀"